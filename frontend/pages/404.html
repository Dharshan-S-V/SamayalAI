<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 – SamayalAI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDF6EC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;-webkit-font-smoothing:antialiased}
.wrap{text-align:center;max-width:440px}
.emoji{font-size:5rem;display:block;margin-bottom:1.25rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.code{font-family:'Playfair Display',serif;font-size:5.5rem;font-weight:900;color:#E8610A;line-height:1}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:#1A1A1C;margin:.5rem 0}
p{color:#5A5856;line-height:1.7;margin-bottom:.75rem}
.ta{font-family:'Noto Sans Tamil',sans-serif;font-size:.95rem;color:#2D6A4F;margin-bottom:2rem}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{padding:.8rem 1.75rem;border-radius:99px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .18s}
.p{background:#E8610A;color:#fff}.p:hover{background:#B5490A;transform:translateY(-1px)}
.s{background:#fff;color:#5A5856;border:1.5px solid rgba(0,0,0,.14)}.s:hover{border-color:#E8610A;color:#E8610A}
</style>
</head>
<body>
<div class="wrap">
  <span class="emoji">🍛</span>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>This page evaporated like steam from a hot idli!</p>
  <p class="ta">இந்த பக்கம் கிடைக்கவில்லை!</p>
  <div class="btns">
    <a href="/dashboard" class="p">🏠 Dashboard</a>
    <a href="/" class="s">← Home</a>
  </div>
</div>
</body>
</html>
